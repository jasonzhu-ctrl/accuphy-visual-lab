<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Eurostile Heavy'; src: local('Eurostile Heavy'), local('Eurostile-Hea'); font-weight: 800; } /* URW Eurostile Heavy activated by the company's Creative Cloud (HQ 2026-10-26): no font file is shipped or read */
  @font-face { font-family: 'Instrument Sans'; src: url('fonts/InstrumentSans-Variable.ttf') format('truetype'); font-weight: 400 700; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grad { position: absolute; left: 0; top: 0; width: 1080px; height: 1100px; opacity: 0;
    background: linear-gradient(180deg, rgba(2,8,14,.62) 0%, rgba(2,8,14,.38) 55%, rgba(2,8,14,0) 100%); }
  /* the small wordmark: top left, inside the 250 px top safe zone's edge, from the first frame */
  #mark { position: absolute; left: 64px; top: 262px; width: 250px; opacity: .9; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
  #block { position: absolute; left: 64px; width: 952px; color: #fff; }
  .num { font-family: 'Eurostile Heavy'; font-size: 230px; line-height: .9; letter-spacing: -.005em; white-space: nowrap; text-shadow: 0 4px 30px rgba(0,0,0,.45); }
  .num .unit { font-size: .46em; margin-left: .08em; vertical-align: .62em; letter-spacing: .02em; }
  .rule { margin-top: 20px; height: 6px; background: #028CDF; border-radius: 3px; box-shadow: 0 0 20px rgba(2,140,223,.6); }
  .line { margin-top: 30px; font-family: 'Instrument Sans'; font-weight: 600; font-size: 70px; line-height: 1.15; letter-spacing: -.005em;
    text-shadow: 0 2px 14px rgba(0,0,0,.55); max-width: 900px; text-wrap: balance; }
  .hidden { display: none }
</style></head>
<body>
<div id="stage">
  <img id="bg">
  <div id="grad"></div>
  <svg id="fan" width="1080" height="1920" style="position:absolute;left:0;top:0;overflow:visible"><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path id="fanp" d="" fill="rgba(2,140,223,0.10)" stroke="#028CDF" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/></svg>
  <img id="mark" src="logo.png">
  <div id="block">
    <div class="num" id="num"><span id="n"></span><span class="unit" id="unit"></span></div>
    <div class="rule" id="rule"></div>
    <div class="line" id="line"></div>
  </div>
</div>
<script>
  // a still: { bg, top, grad, num, unit, line, ruleW }
  window.setStill = (c) => {
    const $ = (id) => document.getElementById(id)
    $('bg').src = c.bg; $('grad').style.opacity = c.grad ? 1 : 0
    $('fanp').setAttribute('d', c.fan ? 'M' + [c.fan.apex, ...c.fan.arc].map((q) => q.join(',')).join(' L') + ' Z' : '') // the beam's 135° on the water, projected from the 3D view
    $('block').style.top = c.top + 'px'
    $('num').classList.toggle('hidden', !c.num); $('rule').classList.toggle('hidden', !c.num)
    $('n').textContent = c.num || ''; $('unit').textContent = c.unit || ''
    $('line').textContent = c.line || ''; $('line').style.marginTop = c.num ? '30px' : '0'
    $('rule').style.width = c.num ? `${$('num').getBoundingClientRect().width * (c.ruleW ?? 1)}px` : '0'
    return new Promise((r) => { const im = $('bg'); if (im.complete && im.naturalWidth) r(); else im.onload = r })
  }
</script>
</body></html>
