<!doctype html>
<html><head><meta charset="utf-8">
<!-- The PingLive ad's type layer (r1, 2026-11-05): a copy of overlay-base.html (the Mini film's, unchanged) with the PingLive beats.
     comp-pl.mjs calls setFrame({ bg, t, info, lines, beats, style }) per frame; style A (Jason's pick for the Mini, #225), the Lab's own
     drag hint (r17: thin reticle recorded on the water, small caption here), the stacked end card. 1080×1920. Lines: lines-pl.json;
     beats: beats-pl.json. Eurostile Heavy from Creative Cloud (local()). -->
<style>
  @font-face { font-family: 'Eurostile Heavy'; src: local('Eurostile Heavy'), local('Eurostile-Hea'); font-weight: 800; }
  @font-face { font-family: 'Instrument Sans'; src: url('fonts/InstrumentSans-Variable.ttf') format('truetype'); font-weight: 400 700; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; }
  #bg { position: absolute; left: -12px; top: -12px; width: 1104px; height: 1944px; }
  .cap { position: absolute; left: 0; width: 1080px; top: 330px; will-change: opacity, transform; }
  .hidden { display: none !important } /* the title sets display:flex later in the sheet; this must still win */
  /* A · 标题 + 蓝线 — Jason's pick (11-03, #225). HQ: over bright water the contrast was weak, so the top is darkened more and
     the type gets a soft shadow; still no box */
  #A .grad { position: absolute; left: 0; top: 0; width: 1080px; height: 980px; background: linear-gradient(180deg, rgba(2,8,14,.74) 0%, rgba(2,8,14,.52) 45%, rgba(2,8,14,.22) 75%, rgba(2,8,14,0) 100%); }
  #A .cap { left: 72px; width: 936px; }
  #A .head { font-family: 'Eurostile Heavy'; font-size: 88px; line-height: 1.02; letter-spacing: .005em; color: rgba(255,255,255,.9); text-shadow: 0 2px 6px rgba(0,12,20,.7), 0 10px 40px rgba(0,0,0,.6); text-wrap: balance; white-space: pre-line; } /* r15: an explicit line break in a head is kept (open: "Learn" / "Forward-Facing Sonar", not split at the hyphen). r2 (Jason): white a touch softer */
  #A .rule { width: 160px; height: 8px; margin: 26px 0 24px; background: #028CDF; border-radius: 4px; box-shadow: 0 0 24px rgba(2,140,223,.7); transform-origin: left; }
  #A .sub { font-family: 'Instrument Sans'; font-weight: 500; font-size: 52px; line-height: 1.22; color: rgba(255,255,255,.86); text-shadow: 0 2px 5px rgba(0,12,20,.7), 0 6px 24px rgba(0,0,0,.6); max-width: 860px; text-wrap: balance; }
  /* B · 玻璃板 */
  #B .cap { left: 60px; width: auto; max-width: 960px; padding: 40px 52px 44px; border-radius: 28px; background: rgba(8, 18, 30, .42); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); border: 1.5px solid rgba(255,255,255,.22); box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18); }
  #B .kick { display: flex; align-items: center; gap: 14px; font-family: 'Instrument Sans'; font-weight: 600; font-size: 26px; letter-spacing: .22em; color: #7CC4F2; margin-bottom: 18px; }
  #B .kick::before { content: ''; width: 12px; height: 12px; border-radius: 6px; background: #028CDF; box-shadow: 0 0 16px #028CDF; }
  #B .head { font-family: 'Eurostile Heavy'; font-size: 72px; line-height: 1.06; text-wrap: balance; }
  #B .sub { font-family: 'Instrument Sans'; font-weight: 500; font-size: 46px; line-height: 1.24; color: rgba(255,255,255,.88); margin-top: 16px; text-wrap: balance; }
  /* C · 电影字幕 */
  #C .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #C .cap { left: 84px; width: 912px; padding-left: 34px; border-left: 6px solid #028CDF; }
  #C .kick { font-family: 'Instrument Sans'; font-weight: 600; font-size: 28px; letter-spacing: .3em; color: #7CC4F2; text-transform: uppercase; margin-bottom: 22px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #C .head { font-family: 'Eurostile Heavy'; font-size: 96px; line-height: 1; letter-spacing: -.005em; text-shadow: 0 8px 40px rgba(0,0,0,.55); text-wrap: balance; }
  #C .sub { font-family: 'Instrument Sans'; font-weight: 400; font-size: 50px; line-height: 1.22; color: rgba(255,255,255,.9); margin-top: 26px; text-shadow: 0 2px 16px rgba(0,0,0,.6); max-width: 820px; text-wrap: balance; }
  /* r2: the title over the opening line — the Lab panel's "ACCUPHY | LAB" head (index.css .ac-lab-head): the white logo, a thin
     rule, then "Sonar Lab" in Eurostile small caps, tracked */
  .title { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; opacity: .92; }
  .title img { height: 60px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
  .title i { display: block; width: 2px; height: 54px; background: rgba(255,255,255,.55); }
  .title span { font-family: 'Eurostile Heavy'; font-size: 34px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.86); padding-top: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  /* the big number of the angle beat (shot 4), under the caption on the left; the fan is low in the frame */
  .big { font-family: 'Eurostile Heavy'; font-size: 150px; line-height: 1; margin-top: 30px; text-shadow: 0 8px 40px rgba(0,0,0,.55); }
  .big small { display: inline-block; vertical-align: middle; font-size: 44px; color: #7CC4F2; margin: 0 0 18px 34px; font-family: 'Instrument Sans'; font-weight: 600; letter-spacing: .18em; }
  /* the finger cue: the tour's boat cue (tour.css: 64 px ring, #028cdf, the hand's tip on the ring centre), ×3 for 1080 px */
  #cue { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #cue .ring { position: absolute; left: -96px; top: -96px; width: 192px; height: 192px; border-radius: 50%; box-sizing: border-box; border: 9px solid #028cdf; background: rgba(2,140,223,.24); box-shadow: 0 0 30px rgba(2,140,223,.6); }
  #cue .wave { position: absolute; left: -96px; top: -96px; width: 192px; height: 192px; border-radius: 50%; box-sizing: border-box; border: 6px solid rgba(2,140,223,.7); }
  #cue img { position: absolute; width: 96px; left: -38px; top: -5px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  /* r2: the tour's 4 s progress arc (tour.css .ac-tour-prog): a thin white arc filling round the ring while the boat is held */
  #cue svg { position: absolute; left: -126px; top: -126px; width: 252px; height: 252px; transform: rotate(-90deg); overflow: visible; }
  #cue svg circle { fill: none; }
  #cue .track { stroke: rgba(255,255,255,.22); stroke-width: 7; }
  #cue .arc { stroke: #fff; stroke-width: 9; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(2,140,223,.9)); }
  /* the end card over black — r10 (Jason 11-03: 最后一个页面只保留logo 加上Sonar Lab 其他全部去掉 你重新排版设计下): only the
     white logo file and "Sonar Lab" (Eurostile Heavy, tracked caps as in the opening title), centred a little above the middle of the
     Reels safe band (269–1248), lots of black around it. Two layouts for Jason to pick: stack (logo over Sonar Lab) and inline
     (ACCUPHY | SONAR LAB, the opening's lockup, larger). Enters with a 0.5 s fade and a slight scale-up. */
  #end { position: absolute; inset: 0; }
  #end .lock { position: absolute; left: 0; width: 1080px; top: 700px; display: flex; align-items: center; justify-content: center; transform-origin: 50% 50%; }
  #end.stack .lock { flex-direction: column; gap: 58px; }
  #end.stack img { width: 600px; height: auto; }
  #end.stack span { font-family: 'Eurostile Heavy'; font-size: 50px; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase; color: rgba(255,255,255,.84); }
  #end.stack i { display: none; }
  #end.inline .lock { gap: 34px; }
  #end.inline img { height: 84px; width: auto; }
  #end.inline i { display: block; width: 3px; height: 78px; background: rgba(255,255,255,.5); }
  #end.inline span { font-family: 'Eurostile Heavy'; font-size: 46px; letter-spacing: .2em; margin-right: -.2em; text-transform: uppercase; color: rgba(255,255,255,.86); padding-top: 6px; }
</style></head>
<body>
<div id="stage">
  <img id="bg">
  <div id="A" class="style"><div class="grad"></div><div class="cap"><div class="title hidden"><img src="logo.png"><i></i><span>Sonar Lab</span></div><div class="head"></div><div class="rule"></div><div class="sub"></div><div class="big hidden"></div></div></div>
  <div id="B" class="style"><div class="cap"><div class="kick">ACCUPHY LAB</div><div class="head"></div><div class="sub"></div><div class="big hidden"></div></div></div>
  <div id="C" class="style"><div class="vig"></div><div class="cap"><div class="kick">Accuphy Lab</div><div class="head"></div><div class="sub"></div><div class="big hidden"></div></div></div>
  <!-- r17 (Jason on r16: 这里这个特效相比原版实在太粗了 一点不高级): the web's own drag cue instead of the ring + finger: its thin reticle is
       recorded on the water (film-base.mjs keeps it on), and its small caption "Drag the boat to move it" is drawn here as the web draws it
       (13 px at the 360 px phone width = 39 px, white 92 %, soft shadow), above the boat until the drag gets going -->
  <div id="labhint" class="hidden" style="position:absolute;left:0;top:0;white-space:nowrap;font-family:'Instrument Sans';font-weight:500;font-size:39px;letter-spacing:.01em;color:rgba(255,255,255,.92);text-shadow:0 3px 6px rgba(0,0,0,.55),0 0 36px rgba(0,0,0,.45)"></div>
  <div id="cue" class="hidden"><div class="wave"></div><div class="ring"></div><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="arc" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="0 100"/></svg><img src="finger.svg"></div>
  <div id="end" class="hidden stack"><div class="lock"><img src="logo.png"><i></i><span>Sonar Lab</span></div></div>
</div>
<script>
  const $ = (q) => document.querySelector(q)
  const clamp = (u) => Math.min(1, Math.max(0, u)), span = (t, a, b) => clamp((t - a) / (b - a)), ease = (u) => 1 - (1 - u) ** 3
  // the beats come from beats-pl.json: { hook: [t0, t1], drag, phone, down, pano, reveal, end }; captions fade/slide in over 0.5 s, out over 0.35 s
  const TOP = { hook: 300, drag: 330, phone: 300, down: 330, pano: 330, reveal: 330 }
  window.setFrame = async ({ bg, t, info, lines, beats, style = 'A', type = true, endLayout = 'stack' }) => {
    const END = beats.end[0]
    for (const el of document.querySelectorAll('.style')) el.classList.toggle('hidden', !type || el.id !== style || t >= END)
    $('#bg').src = bg || ''; $('#bg').style.display = bg ? '' : 'none'
    const key = Object.keys(TOP).find((k) => t >= beats[k][0] && t < beats[k][1])
    const S = $(`#${style}`), cap = S.querySelector('.cap')
    if (key && type) {
      const [a, b] = beats[key], L = lines[key] || {}
      S.querySelector('.head').textContent = L.head || ''; S.querySelector('.sub').textContent = L.sub || ''
      S.querySelector('.sub').style.display = L.sub ? '' : 'none'
      cap.style.top = TOP[key] + 'px'
      const title = S.querySelector('.title'); if (title) title.classList.toggle('hidden', key !== 'hook')
      const o = ease(span(t, a + (key === 'hook' ? 0.4 : 0.15), a + (key === 'hook' ? 1.0 : 0.65))) * (1 - ease(span(t, b - 0.35, b)))
      cap.style.opacity = o; cap.style.transform = `translateY(${(1 - o) * 22}px)`
      S.querySelector('.big').classList.add('hidden')
    } else cap.style.opacity = 0
    // the Lab's own drag hint (r17): its small caption above the boat for the first 2.2 s of the drag
    const d0 = beats.drag[0], hint = type && t >= d0 && t < d0 + 2.2 && info?.boat
    $('#labhint').classList.toggle('hidden', !hint)
    if (hint) { const e = $('#labhint'); e.textContent = lines.hint || 'Drag the boat to move it'; const o = ease(span(t, d0, d0 + 0.5)) * (1 - ease(span(t, d0 + 1.6, d0 + 2.2))); e.style.opacity = o; e.style.transform = `translate(${Math.min(1008 - e.offsetWidth, Math.max(72, info.boat[0] - e.offsetWidth / 2))}px, ${info.boat[1] - 150}px)` } // inside x 72–1008 (as overlay-base.html bf62de5)
    $('#cue').classList.add('hidden')
    const end = t >= END
    $('#end').classList.toggle('hidden', !end)
    if (end) { // the lockup only (Mini r10): its centre at y 740
      $('#end').classList.toggle('stack', endLayout !== 'inline'); $('#end').classList.toggle('inline', endLayout === 'inline')
      const Lk = $('#end .lock'); Lk.style.top = (740 - Lk.offsetHeight / 2) + 'px'
      const m = ease(span(t, END + 0.2, END + 0.75)); Lk.style.opacity = m; Lk.style.transform = `scale(${0.965 + 0.035 * m})`
    }
    await document.fonts.ready
    if (bg) await new Promise((r) => { const im = $('#bg'); if (im.complete && im.naturalWidth && im.src.endsWith(bg)) r(); else { im.onload = r; im.onerror = r } })
    return document.fonts.check('80px "Eurostile Heavy"')
  }
</script>
</body></html>
