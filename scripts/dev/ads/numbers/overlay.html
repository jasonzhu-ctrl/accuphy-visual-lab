<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Eurostile Heavy'; src: url('fonts/Eurostile-Heavy.otf') format('opentype'); font-weight: 800; }
  @font-face { font-family: 'Instrument Sans'; src: url('fonts/InstrumentSans-Variable.ttf') format('truetype'); font-weight: 400 700; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  /* a quiet darkening of the top third so the type reads on the water */
  #grad { position: absolute; left: 0; top: 0; width: 1080px; height: 980px;
    background: linear-gradient(180deg, rgba(3,12,20,.66) 0%, rgba(3,12,20,.42) 48%, rgba(3,12,20,0) 100%); }
  #block { position: absolute; left: 84px; top: 310px; width: 912px; color: #fff; }
  .title { position: relative; display: inline-block; font-family: 'Eurostile Heavy'; font-size: 54px; letter-spacing: .14em; line-height: 1;
    opacity: 0; transform: translateY(18px); }
  .title .flash { position: absolute; inset: -14px -22px; background: #fff; border-radius: 6px; opacity: 0; mix-blend-mode: screen; }
  .num { position: relative; margin-top: 26px; font-family: 'Eurostile Heavy'; font-size: 250px; line-height: .92; letter-spacing: -.01em;
    text-shadow: 0 4px 36px rgba(0,0,0,.45); white-space: nowrap; }
  .num .deg { display: inline-block; font-size: .52em; vertical-align: top; margin-top: .08em; margin-left: .04em; opacity: 0; transform: scale(1.5); transform-origin: 30% 60%; }
  .rule { position: relative; margin-top: 18px; height: 7px; width: 0; background: #028CDF; border-radius: 4px; box-shadow: 0 0 22px rgba(2,140,223,.65); }
  .rule .tick { position: absolute; right: -2px; top: -9px; width: 4px; height: 25px; background: #028CDF; border-radius: 2px; }
  .label { margin-top: 30px; font-family: 'Instrument Sans'; font-weight: 600; font-size: 35px; letter-spacing: .34em; text-transform: uppercase;
    color: rgba(255,255,255,.74); opacity: 0; transform: translateY(14px); white-space: nowrap; }
  .point { display: flex; align-items: center; gap: 22px; margin-top: 22px; font-family: 'Instrument Sans'; font-weight: 600; font-size: 35px;
    letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.92); opacity: 0; transform: translateY(14px); white-space: nowrap; }
  .point .dash { width: 34px; height: 5px; background: #028CDF; border-radius: 3px; box-shadow: 0 0 14px rgba(2,140,223,.7); flex: none; }
</style></head>
<body>
<div id="stage">
  <img id="bg" src="frames/0001.jpg">
  <div id="grad"></div>
  <div id="block">
    <div class="title" id="title">PANORAMIC VIEW<div class="flash" id="flash"></div></div>
    <div class="num"><span id="n">0</span><span class="deg" id="deg">°</span></div>
    <div class="rule" id="rule"><div class="tick"></div></div>
    <div class="label" id="label">Full beam width</div>
    <div class="point" id="p1"><div class="dash"></div><div>Scan shallow structure</div></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id)
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1)
  const outExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u))
  const outCubic = (u) => 1 - Math.pow(1 - u, 3)
  const outBack = (u) => 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2)
  const inCubic = (u) => u * u * u
  // the choreography of the Panoramic beat, seconds from the clip's start
  const T = { title: 1.0, num: 1.3, numEnd: 2.05, rule: 1.45, ruleEnd: 1.95, deg: 2.05, label: 2.15, point: 3.2, exit: 5.3, exitEnd: 5.75 }
  window.setT = (t) => {
    const b = $('block')
    // title: flash then settle
    const ut = seg(t, T.title, T.title + .32)
    $('title').style.opacity = ut; $('title').style.transform = `translateY(${18 * (1 - outCubic(ut))}px)`
    $('flash').style.opacity = t < T.title ? 0 : (1 - seg(t, T.title, T.title + .16)) * .9
    // the number counts up
    const un = outExpo(seg(t, T.num, T.numEnd))
    $('n').textContent = t < T.num ? '' : String(Math.round(135 * un))
    const ud = seg(t, T.deg, T.deg + .28)
    $('deg').style.opacity = ud; $('deg').style.transform = `scale(${1.5 - .5 * outBack(ud)})`
    // the brand-blue rule draws under it
    const nw = $('n').getBoundingClientRect().width
    const ur = outCubic(seg(t, T.rule, T.ruleEnd))
    $('rule').style.width = `${Math.max(0, (nw + 86) * ur)}px`; $('rule').style.opacity = t < T.rule ? 0 : 1
    // label, then the bullet
    for (const [id, t0] of [['label', T.label], ['p1', T.point]]) {
      const u = outCubic(seg(t, t0, t0 + .45)); $(id).style.opacity = u; $(id).style.transform = `translateY(${14 * (1 - u)}px)`
    }
    // the whole block leaves upward before the next beat
    const ue = inCubic(seg(t, T.exit, T.exitEnd))
    b.style.opacity = 1 - ue; b.style.transform = `translateY(${-60 * ue}px)`
    $('grad').style.opacity = 1 - ue
  }
  window.setFrame = (i) => { $('bg').src = `frames/${String(i).padStart(4, '0')}.jpg` }
</script>
</body></html>
